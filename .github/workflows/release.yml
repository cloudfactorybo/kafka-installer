# Al subir un tag v*, publica una release con el instalador y su checksum.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxis
        run: |
          bash -n install-kafka-seguro.sh
          bash -n get-kafka-installer.sh

      - name: Generar checksum
        run: sha256sum install-kafka-seguro.sh > install-kafka-seguro.sh.sha256

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install-kafka-seguro.sh
            install-kafka-seguro.sh.sha256
